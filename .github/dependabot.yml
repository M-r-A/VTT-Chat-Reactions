# Updates for npm packages and for the GitHub Actions of the workflows, which are pinned to commit SHAs
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 (the native compiler) has no JavaScript API yet, which ts-loader and typescript-eslint need
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
