name: Release Creation

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # Build dist/ from source instead of shipping a committed bundle
      - run: npm ci --ignore-scripts
      - run: npm run build:production

      # Substitute the Manifest and Download URLs in the module.json
      - name: Substitute Manifest and Download Links For Versioned Ones
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "dist/module.json";
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            const tag = process.env.TAG;
            manifest.version = tag.replace(/^v/, "");
            manifest.url = process.env.REPO_URL;
            manifest.manifest = `${process.env.REPO_URL}/releases/latest/download/module.json`;
            manifest.download = `${process.env.REPO_URL}/releases/download/${tag}/module.zip`;
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2) + "\n");
          '

      # Create a zip file with all files required by the module to add to the release
      - run: cd dist && zip -r ../module.zip .

      # Create a release for this specific version
      - name: Update Release with Files
        id: create_version_release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          allowUpdates: true # Set this to false if you want to prevent updating existing releases
          name: ${{ github.event.release.name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "./dist/module.json, ./module.zip"
          tag: ${{ github.event.release.tag_name }}
          body: ${{ github.event.release.body }}
